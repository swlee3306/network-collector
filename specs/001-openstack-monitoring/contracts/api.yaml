openapi: 3.0.3
info:
  title: OpenStack Monitoring API
  version: 1.0.0
  description: 오픈스택 통합 모니터링 시스템 REST API

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server

tags:
  - name: Authentication
    description: 인증 관련 엔드포인트
  - name: Instances
    description: 서버 인스턴스 조회
  - name: Projects
    description: 프로젝트 및 리소스 사용량 조회
  - name: Networks
    description: 네트워크 리소스 조회
  - name: Hypervisors
    description: 하이퍼바이저 조회
  - name: Flavors
    description: 플레이버 조회
  - name: Volumes
    description: 볼륨 조회
  - name: Topology
    description: 네트워크 토폴로지 조회
  - name: Metrics
    description: 메트릭 데이터 조회
  - name: Events
    description: 실시간 이벤트 스트림

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 로그인
      description: 단일 운영자 역할 인증
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: 인증 실패

  /instances:
    get:
      tags:
        - Instances
      summary: 서버 인스턴스 목록 조회
      description: 모든 서버 인스턴스의 현재 상태 조회
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
          description: 프로젝트 ID로 필터링
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, SHUTOFF, ERROR, BUILDING]
          description: 상태로 필터링
      responses:
        '200':
          description: 인스턴스 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instance'
        '500':
          $ref: '#/components/responses/Error'

  /instances/{instance_id}:
    get:
      tags:
        - Instances
      summary: 특정 인스턴스 상세 조회
      security:
        - bearerAuth: []
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 인스턴스 상세 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /projects:
    get:
      tags:
        - Projects
      summary: 프로젝트 목록 및 리소스 사용량 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 프로젝트 목록 및 리소스 사용량
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectWithUsage'
        '500':
          $ref: '#/components/responses/Error'

  /networks:
    get:
      tags:
        - Networks
      summary: 네트워크 리소스 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 네트워크 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Network'
        '500':
          $ref: '#/components/responses/Error'

  /hypervisors:
    get:
      tags:
        - Hypervisors
      summary: 하이퍼바이저 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 하이퍼바이저 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  hypervisors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hypervisor'
        '500':
          $ref: '#/components/responses/Error'

  /flavors:
    get:
      tags:
        - Flavors
      summary: 플레이버 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 플레이버 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  flavors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flavor'
        '500':
          $ref: '#/components/responses/Error'

  /volumes:
    get:
      tags:
        - Volumes
      summary: 볼륨 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 볼륨 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  volumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Volume'
        '500':
          $ref: '#/components/responses/Error'

  /topology/vm/{vm_id}:
    get:
      tags:
        - Topology
      summary: 특정 VM의 네트워크 토폴로지 조회
      description: VM부터 물리 호스트까지의 전체 네트워크 경로 조회 (SC-001: 5초 이내)
      security:
        - bearerAuth: []
      parameters:
        - name: vm_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 네트워크 토폴로지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /topology/host/{host_id}:
    get:
      tags:
        - Topology
      summary: 특정 호스트의 네트워크 토폴로지 조회
      description: 호스트에 연결된 모든 VM과 네트워크 경로 조회
      security:
        - bearerAuth: []
      parameters:
        - name: host_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 네트워크 토폴로지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /metrics/{resource_type}/{resource_id}:
    get:
      tags:
        - Metrics
      summary: 과거 메트릭 조회
      description: 특정 리소스의 과거 메트릭을 시간 범위로 조회 (SC-007: 3초 이내)
      security:
        - bearerAuth: []
      parameters:
        - name: resource_type
          in: path
          required: true
          schema:
            type: string
            enum: [instance, network, hypervisor]
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 시작 시간
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 종료 시간
      responses:
        '200':
          description: 메트릭 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '400':
          description: 잘못된 시간 범위
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /events/stream:
    get:
      tags:
        - Events
      summary: 실시간 이벤트 스트림 (SSE)
      description: Server-Sent Events를 통한 실시간 데이터 업데이트
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSE 스트림
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Instance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        openstack_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, SHUTOFF, ERROR, BUILDING, DELETED]
        project_id:
          type: string
          format: uuid
        flavor_id:
          type: string
          format: uuid
        hypervisor_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectWithUsage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        openstack_id:
          type: string
        name:
          type: string
        resource_usage:
          type: object
          properties:
            instances_count:
              type: integer
            networks_count:
              type: integer
            volumes_count:
              type: integer
            total_cpu:
              type: integer
            total_memory_mb:
              type: integer

    Network:
      type: object
      properties:
        id:
          type: string
          format: uuid
        openstack_id:
          type: string
        name:
          type: string
        status:
          type: string
        project_id:
          type: string
          format: uuid
        shared:
          type: boolean
        connected_vms_count:
          type: integer

    Hypervisor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        openstack_id:
          type: string
        hostname:
          type: string
        host_ip:
          type: string
        status:
          type: string
        state:
          type: string
          enum: [up, down]
        vcpus_used:
          type: integer
        vcpus_total:
          type: integer
        memory_used_mb:
          type: integer
        memory_total_mb:
          type: integer
        running_vms_count:
          type: integer

    Flavor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        openstack_id:
          type: string
        name:
          type: string
        vcpus:
          type: integer
        ram_mb:
          type: integer
        disk_gb:
          type: integer
        usage_count:
          type: integer

    Volume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        openstack_id:
          type: string
        name:
          type: string
        status:
          type: string
        size_gb:
          type: integer
        project_id:
          type: string
          format: uuid
        attached_to:
          type: string
          format: uuid
          nullable: true

    Topology:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'
        paths:
          type: array
          items:
            type: array
            items:
              type: string
              format: uuid
          description: VM부터 호스트까지의 모든 가능한 경로

    TopologyNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        node_type:
          type: string
          enum: [VM, PORT, NETWORK, ROUTER, HOST, UNKNOWN]
        name:
          type: string
        is_accessible:
          type: boolean
        metadata:
          type: object

    TopologyEdge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        edge_type:
          type: string
        metadata:
          type: object

    Metrics:
      type: object
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
        data_points:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              values:
                type: object
                description: 메트릭 타입에 따라 다른 필드 (cpu_usage_percent, memory_usage_mb, etc.)

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Error:
      description: 서버 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

