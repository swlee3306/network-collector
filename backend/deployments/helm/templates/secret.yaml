apiVersion: v1
kind: Secret
metadata:
  name: {{ include "network-collector.fullname" . }}-secrets
  labels:
    {{- include "network-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  DB_PASSWORD: {{ .Values.secrets.dbPassword | default "change-me-in-production" | quote }}
  
  # OpenStack credentials
  OPENSTACK_AUTH_URL: {{ .Values.secrets.openstackAuthURL | default "" | quote }}
  OPENSTACK_USERNAME: {{ .Values.secrets.openstackUsername | default "" | quote }}
  OPENSTACK_PASSWORD: {{ .Values.secrets.openstackPassword | default "" | quote }}
  OPENSTACK_PROJECT_ID: {{ .Values.secrets.openstackProjectID | default "" | quote }}
  
  # Authentication
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "change-me-in-production" | quote }}
  AUTH_TOKEN: {{ .Values.secrets.authToken | default "change-me-in-production" | quote }}

