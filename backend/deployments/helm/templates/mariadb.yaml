{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "network-collector.fullname" . }}-mariadb
  labels:
    {{- include "network-collector.labels" . | nindent 4 }}
    app: mariadb
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: mariadb
    {{- include "network-collector.selectorLabels" . | nindent 4 }}
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "network-collector.fullname" . }}-mariadb
  labels:
    {{- include "network-collector.labels" . | nindent 4 }}
    app: mariadb
spec:
  serviceName: {{ include "network-collector.fullname" . }}-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
      {{- include "network-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: mariadb
        {{- include "network-collector.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: mariadb
        image: {{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}
        imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "network-collector.fullname" . }}-secrets
              key: DB_PASSWORD
        - name: MYSQL_DATABASE
          value: {{ .Values.database.name | quote }}
        - name: MYSQL_USER
          value: {{ .Values.database.user | quote }}
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "network-collector.fullname" . }}-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql
        resources:
          {{- toYaml .Values.mariadb.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
  volumeClaimTemplates:
  - metadata:
      name: mariadb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.mariadb.storage.storageClass }}
      resources:
        requests:
          storage: {{ .Values.mariadb.storage.size }}
{{- end }}

