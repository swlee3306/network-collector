{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network-collector.fullname" . }}-api
  labels:
    {{- include "network-collector.labels" . | nindent 4 }}
    app: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
      {{- include "network-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: api
        {{- include "network-collector.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: api
        image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command: ["/app/api"]
        ports:
        - containerPort: {{ .Values.api.service.port }}
          name: http
        env:
        # Database configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "network-collector.fullname" . }}-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: DB_NAME
        # Server configuration
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: SERVER_PORT
        - name: SSE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: SSE_ENABLED
        # Authentication
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "network-collector.fullname" . }}-secrets
              key: JWT_SECRET
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "network-collector.fullname" . }}-secrets
              key: AUTH_TOKEN
        # Logging configuration
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: ENVIRONMENT
        # Login type configuration
        - name: LOGIN_TYPE
          valueFrom:
            configMapKeyRef:
              name: {{ include "network-collector.fullname" . }}-config
              key: LOGIN_TYPE
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.api.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.api.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "network-collector.fullname" . }}-api
  labels:
    {{- include "network-collector.labels" . | nindent 4 }}
    app: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.port }}
      protocol: TCP
      name: http
  selector:
    app: api
    {{- include "network-collector.selectorLabels" . | nindent 4 }}
{{- end }}

