apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-collector
  namespace: default
  labels:
    app: network-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-collector
  template:
    metadata:
      labels:
        app: network-collector
    spec:
      # 모든 노드에서 실행 가능 (마스터 및 워커 노드)
      # 마스터 노드의 taint 허용 (control-plane 노드는 기본적으로 taint가 있음)
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: collector
        image: network-collector:latest
        imagePullPolicy: Never  # 로컬 이미지만 사용 (워커 노드에도 이미지 배포 필요)
        command: ["/app/collector"]
        env:
        # Database configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: DB_NAME
        # OpenStack configuration
        - name: OPENSTACK_AUTH_URL
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: OPENSTACK_AUTH_URL
        - name: OPENSTACK_USERNAME
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: OPENSTACK_USERNAME
        - name: OPENSTACK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: OPENSTACK_PASSWORD
        - name: OPENSTACK_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: OPENSTACK_PROJECT_ID
        - name: OPENSTACK_DOMAIN_NAME
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: OPENSTACK_DOMAIN_NAME
        - name: OPENSTACK_ENDPOINT_TYPE
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: OPENSTACK_ENDPOINT_TYPE
        # Logging configuration
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: ENVIRONMENT
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep collector | grep -v grep"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep collector | grep -v grep"
          initialDelaySeconds: 10
          periodSeconds: 5
      restartPolicy: Always

