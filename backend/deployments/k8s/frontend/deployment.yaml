apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-collector-frontend
  namespace: default
  labels:
    app: network-collector-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-collector-frontend
  template:
    metadata:
      labels:
        app: network-collector-frontend
    spec:
      # 모든 노드에서 실행 가능 (마스터 및 워커 노드)
      # 마스터 노드의 taint 허용 (control-plane 노드는 기본적으로 taint가 있음)
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: frontend
        image: network-collector-frontend:latest
        imagePullPolicy: Never  # 로컬 이미지만 사용 (워커 노드에도 이미지 배포 필요)
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: network-collector-frontend-config
              key: REACT_APP_API_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: network-collector-frontend
  namespace: default
  labels:
    app: network-collector-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: network-collector-frontend

