apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-collector-frontend
  namespace: default
  labels:
    app: network-collector-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-collector-frontend
  template:
    metadata:
      labels:
        app: network-collector-frontend
    spec:
      containers:
      - name: frontend
        image: network-collector-frontend:latest
        imagePullPolicy: IfNotPresent  # 로컬 이미지 우선, 없으면 Pull 시도
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: network-collector-frontend-config
              key: REACT_APP_API_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: network-collector-frontend
  namespace: default
  labels:
    app: network-collector-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: network-collector-frontend

