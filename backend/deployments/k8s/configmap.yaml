apiVersion: v1
kind: ConfigMap
metadata:
  name: network-collector-config
  namespace: default
data:
  # Database configuration
  DB_HOST: "mariadb"
  DB_PORT: "3306"
  DB_USER: "openstack_monitor"
  DB_NAME: "openstack_monitor"
  
  # Server configuration
  SERVER_PORT: "8080"
  SSE_ENABLED: "true"
  
  # Logging configuration
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  
  # OpenStack Domain (non-sensitive)
  OPENSTACK_DOMAIN_NAME: "default"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-collector-frontend-config
  namespace: default
data:
  REACT_APP_API_URL: "http://network-collector-api:8080/api/v1"

