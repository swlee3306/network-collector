apiVersion: v1
kind: ConfigMap
metadata:
  name: network-collector-config
  namespace: default
data:
  # Database configuration
  DB_HOST: "mariadb"
  DB_PORT: "3306"
  DB_USER: "openstack_monitor"
  DB_NAME: "openstack_monitor"
  
  # Server configuration
  SERVER_PORT: "8080"
  SSE_ENABLED: "true"
  
  # Logging configuration
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  
  # OpenStack Domain (non-sensitive)
  OPENSTACK_DOMAIN_NAME: "default"
  
  # OpenStack Endpoint Type
  # "public": Use public endpoint (default, accessible from external networks)
  # "internal": Use internal endpoint (accessible only from internal networks)
  # "admin": Use admin endpoint (for administrative access)
  # Note: If the specified endpoint type is not available, the system will automatically fallback to "public"
  OPENSTACK_ENDPOINT_TYPE: "public"
  
  # Login type configuration
  # "internal": Login endpoint is public (no authentication required) - default
  # "public": Login endpoint requires authentication
  LOGIN_TYPE: "internal"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-collector-frontend-config
  namespace: default
data:
  # 상대 경로 사용: Ingress를 통해 자동으로 라우팅됨
  # 외부 접속 시에도 동일한 호스트/포트를 사용하므로 문제없음
  REACT_APP_API_URL: "/api/v1"

