apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: default
  labels:
    app: mariadb
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: mariadb
  clusterIP: None
---
# NodePort Service for external access to MariaDB
apiVersion: v1
kind: Service
metadata:
  name: mariadb-nodeport
  namespace: default
  labels:
    app: mariadb
    service-type: external
spec:
  type: NodePort
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30306  # External port: <node-ip>:30306
      name: mysql
  selector:
    app: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: default
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: DB_PASSWORD
        - name: MYSQL_DATABASE
          value: "openstack_monitor"
        - name: MYSQL_USER
          value: "openstack_monitor"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
  volumeClaimTemplates:
  - metadata:
      name: mariadb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-path  # local-path-storage 사용 (또는 ""로 기본 StorageClass 사용)
      resources:
        requests:
          storage: 20Gi

