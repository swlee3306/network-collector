apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: network-collector-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: network-collector.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: network-collector-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: network-collector-api
            port:
              number: 8080

