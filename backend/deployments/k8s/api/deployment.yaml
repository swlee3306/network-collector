apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-collector-api
  namespace: default
  labels:
    app: network-collector-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-collector-api
  template:
    metadata:
      labels:
        app: network-collector-api
    spec:
      # 모든 노드에서 실행 가능 (마스터 및 워커 노드)
      # 마스터 노드의 taint 허용 (control-plane 노드는 기본적으로 taint가 있음)
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: api
        image: network-collector-api:latest
        imagePullPolicy: IfNotPresent  # 로컬에 없으면 pull 시도 (워커 노드 지원)
        command: ["/app/api"]
        ports:
        - containerPort: 8080
          name: http
        env:
        # Database configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: DB_NAME
        # Server configuration
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: SERVER_PORT
        - name: SSE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: SSE_ENABLED
        # Authentication
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: JWT_SECRET
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: network-collector-secrets
              key: AUTH_TOKEN
        # Logging configuration
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: network-collector-config
              key: ENVIRONMENT
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: network-collector-api
  namespace: default
  labels:
    app: network-collector-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: network-collector-api

